<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- Card Principal -->
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    
                    <!-- Cabeçalho da Tela -->
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                            <span class="fs-3 fw-bold">C13</span>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Criar Conta</h3>
                        <p class="text-muted small">Preencha os dados abaixo para se cadastrar no CHAVE13</p>
                    </div>

                    <!-- Formulário -->
                    <form id="form-cadastro" novalidate>
                        <!-- Campo Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label small fw-semibold text-secondary">Nome Completo</label>
                            <input type="text" class="form-control form-control-lg rounded-3 fs-6" id="nome" placeholder="Digite seu nome" required>
                        </div>

                        <!-- Campo E-mail -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-secondary">E-mail</label>
                            <input type="email" class="form-control form-control-lg rounded-3 fs-6" id="email" placeholder="nome@exemplo.com" required>
                        </div>

                        <!-- Campo Senha -->
                        <div class="mb-3">
                            <label for="senha" class="form-label small fw-semibold text-secondary">Senha</label>
                            <input type="password" class="form-control form-control-lg rounded-3 fs-6" id="senha" placeholder="No mínimo 6 caracteres" required>
                        </div>

                        <!-- NOVO: Campo Telefone (Necessário para o Back-end) -->
                        <div class="mb-3">
                            <label for="telefone" class="form-label small fw-semibold text-secondary">Telefone</label>
                            <input type="tel" class="form-control form-control-lg rounded-3 fs-6" id="telefone" placeholder="(00) 00000-0000" required>
                        </div>

                        <!-- NOVO: Campo Perfil (Necessário para o Back-end) -->
                        <div class="mb-4">
                            <label for="perfil" class="form-label small fw-semibold text-secondary">Perfil de Usuário</label>
                            <select class="form-select form-select-lg rounded-3 fs-6" id="perfil" required>
                                <option value="cliente" selected>Cliente</option>
                                <option value="admin">Administrador</option>
                                <option value="funcionario">Funcionário</option>
                            </select>
                        </div>

                        <!-- Botão de Envio -->
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fs-6 fw-semibold py-2.5 shadow-sm">
                            Finalizar Cadastro
                        </button>
                    </form>

                    <!-- Link de Retorno -->
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Já tem uma conta? 
                            <a href="/home" onclick="navegarPara('/home', event)" class="text-decoration-none fw-semibold">Fazer Login</a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (() => {
        const form = document.getElementById('form-cadastro');
        
        if (form) {
            form.addEventListener('submit', async (event) => {
                event.preventDefault(); 
                
                // Captura os valores digitados na tela
                const nome = document.getElementById('nome').value.trim();
                const email = document.getElementById('email').value.trim();
                const senha = document.getElementById('senha').value;
                const telefone = document.getElementById('telefone').value.trim();
                const perfil = document.getElementById('perfil').value;

                // Validação visual rápida antes do envio
                if (!nome || !email || !senha || !telefone || !perfil) {
                    alert("Por favor, preencha todos os campos obrigatórios!");
                    return;
                }

                // Monta o objeto exatamente com as chaves esperadas pelo seu dados['...'] no Flask
                const payload = {
                    nome: nome,
                    email: email,
                    senha: senha,
                    telefone: telefone,
                    perfil: perfil
                };

                try {
                    // Executa a requisição POST para a sua API do Flask [1]
                    const resposta = await fetch('/api/usuarios', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json' // Avisa o Flask que estamos enviando JSON
                        },
                        body: JSON.stringify(payload) // Converte o objeto JS para texto JSON
                    });

                    const resultado = await resposta.json();

                    if (resposta.ok) {
                        // Sucesso (Status 201 criado pelo seu back-end)
                        alert(`Sucesso: ${resultado.mensagem} (ID: ${resultado.id})`);
                        
                        // Redireciona o usuário para a página inicial da SPA após o cadastro
                        navegarPara('/home');
                    } else {
                        // Trata erros de validação vindos do Flask (como o erro 400 de chave ausente)
                        alert(`Erro no cadastro: ${resultado.erro || resultado.mensagem}`);
                    }

                } catch (erro) {
                    console.error("Erro na comunicação com o servidor:", erro);
                    alert("Não foi possível conectar ao servidor. Verifique se o Flask está rodando.");
                }
            });
        }
    })();
</script>
