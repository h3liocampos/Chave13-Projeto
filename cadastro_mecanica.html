<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHAVE 13 - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('front-end', filename='css/style.css') }}">
</head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #f5b400;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .campo input:focus {
            border-color: #f5b400;
            box-shadow: 0 0 0 3px rgba(245, 180, 0, 0.12);
        }

        .senha-container {
            position: relative;
        }

        .senha-container input {
            padding-right: 75px;
        }

        .mostrar {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #555;
        }

        .btn-cadastrar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f5b400;
            color: #111;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cadastrar:hover {
            background: #dda300;
        }

        .btn-voltar {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #555;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-voltar:hover {
            background: #f5f5f5;
        }

        #mensagem {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            CHAVE <span>13</span>
        </div>

        <h1>Crie sua conta</h1>

        <p class="subtitulo">
            Preencha seus dados para começar.
        </p>

        <form id="usuarioForm">

            <div class="campo">
                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    maxlength="100"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="telefone">
                    Celular
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    maxlength="15"
                    inputmode="numeric"
                >
            </div>

            <div class="campo">
                <label for="senha">
                    Senha
                </label>

                <div class="senha-container">

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        maxlength="255"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="mostrar"
                        onclick="mostrarSenha('senha')"
                    >
                        Mostrar
                    </button>

                </div>
            </div>

            <div class="campo">
                <label for="confirmar_senha">
                    Confirmar senha
                </label>

                <div class="senha-container">

                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Digite a senha novamente"
                        maxlength="255"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="mostrar"
                        onclick="mostrarSenha('confirmar_senha')"
                    >
                        Mostrar
                    </button>

                </div>
            </div>

            <input
                type="hidden"
                id="perfil"
                name="perfil"
                value="usuario"
            >

            <button
                type="submit"
                class="btn-cadastrar"
            >
                Criar conta
            </button>

            <div id="mensagem"></div>

            <button
                type="button"
                class="btn-voltar"
                onclick="window.location.href='/cadastro'"
            >
                Voltar
            </button>

        </form>

    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>

</html>
